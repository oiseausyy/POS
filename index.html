<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVE Outing Game - Pastel Party!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;800&family=Mali:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- THEME VARIABLES (Pastel Pop) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --primary: #FF9A9E;       /* Soft Pink */
            --primary-dark: #ff758c;
            --secondary: #a18cd1;     /* Soft Purple */
            --accent: #fbc2eb;        /* Lavender */
            --success: #84fab0;       /* Mint */
            --warning: #fccb90;       /* Peach */
            --text-main: #555;
            --text-light: #888;
            --card-bg: #ffffff;
            --shadow-soft: 0 10px 25px rgba(149, 157, 165, 0.2);
            --shadow-hover: 0 15px 35px rgba(149, 157, 165, 0.3);
            --radius-box: 24px;
            --radius-btn: 50px;
        }

        body.theme-cute {
            --bg-gradient: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            --primary: #ff9a9e;
        }

        /* --- GLOBAL RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Mali', 'Kanit', cursive;
            background-image: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow-x: hidden;
            padding: 15px;
        }

        /* --- CONTAINER --- */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-soft);
            text-align: center;
            position: relative;
            border: 4px solid #fff;
            transition: transform 0.3s;
        }

        h1 {
            font-family: 'Kanit', sans-serif;
            font-weight: 800;
            font-size: 2.5em;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }

        h2 { font-size: 1.4em; color: var(--secondary); margin-bottom: 15px; }
        p { color: var(--text-light); font-size: 1em; line-height: 1.6; }

        /* --- BUTTONS --- */
        .game-button {
            padding: 12px 28px;
            font-size: 1.1em;
            font-family: 'Kanit', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy effect */
            margin: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .game-button:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .game-button:hover { transform: translateY(-3px); }

        .btn-primary { background: linear-gradient(to right, #ff9a9e, #fecfef); color: #fff; }
        .btn-secondary { background: linear-gradient(to right, #a18cd1, #fbc2eb); color: #fff; }
        .btn-success { background: linear-gradient(to right, #84fab0, #8fd3f4); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .btn-action { background: #fff; border: 2px solid #eee; color: var(--text-main); }
        
        /* --- INPUTS --- */
        .player-input-group {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 10px;
            border: 2px solid #eee;
            transition: border-color 0.3s;
        }
        .player-input-group:focus-within { border-color: var(--primary); }
        
        input {
            border: none;
            flex-grow: 1;
            padding: 10px 15px;
            font-family: 'Mali', cursive;
            font-size: 1rem;
            color: var(--text-main);
            background: transparent;
        }
        
        .remove-btn {
            background: #ff758c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            margin-right: 5px;
            font-weight: bold;
        }

        /* --- GAME AREA --- */
        #game-screen { display: none; flex-direction: column; align-items: center; }

        /* Player Tags */
        #player-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .player-tag {
            background: #fff;
            border: 2px solid #eee;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            transition: all 0.3s;
            position: relative;
        }
        .player-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            font-weight: bold;
        }
        .curse-badge { position: absolute; top: -8px; right: -8px; font-size: 1.2em; animation: pulse 1s infinite; }

        /* Card Perspective */
        #card-area {
            width: 280px;
            height: 380px;
            perspective: 1000px;
            margin: 20px auto;
            position: relative;
        }

        #card-display {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #card-display.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-soft);
            padding: 20px;
            border: 8px solid #fff;
        }

        /* Card Back (Pattern) */
        .card-back {
            background: repeating-linear-gradient(
                45deg,
                #FF9A9E,
                #FF9A9E 10px,
                #fecfef 10px,
                #fecfef 20px
            );
            color: white;
            font-size: 2.5em;
            font-weight: 900;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-back::after {
            content: "MOVE";
            background: white;
            color: var(--primary);
            padding: 10px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: rotate(-5deg);
        }

        /* Card Front */
        .card-front {
            background: #fff;
            transform: rotateY(180deg);
            text-align: center;
            border: 6px solid var(--secondary);
        }

        .card-icon { font-size: 3em; margin-bottom: 15px; display: block; }
        #card-title { font-size: 1.5em; font-weight: 800; color: #333; margin-bottom: 10px; line-height: 1.2; }
        #card-description { font-size: 1.1em; color: #666; }

        /* Card Types Colors */
        .type-action { border-color: #a18cd1; }
        .type-activity { border-color: #fccb90; }
        .type-duel { border-color: #ff758c; }
        .type-curse { border-color: #667eea; }
        .type-keeper { border-color: #84fab0; }

        /* Modal */
        #target-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Inventory */
        #player-inventory { margin-top: 15px; min-height: 40px; }
        .inv-item { 
            background: #fffa65; 
            padding: 8px 15px; 
            border-radius: 15px; 
            font-weight: bold; 
            color: #555;
            box-shadow: 0 3px 0 #e6e600;
            cursor: pointer;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-5px);} 60% {transform: translateY(-3px);} }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div id="target-modal">
        <div class="modal-content">
            <h2 style="color: #667eea;">☠️ เลือกเหยื่อที่จะสาป!</h2>
            <div id="target-players"></div>
        </div>
    </div>

    <div class="container">
        <div id="setup-screen">
            <h1>MOVE COFFEE</h1>
            <p>☕ Outing Party Game ☕</p>
            <br>
            <div id="player-inputs">
                </div>
            
            <div style="margin-top: 20px;">
                <button class="game-button btn-action" id="add-player-btn">➕ เพิ่มคน</button>
                <button class="game-button btn-primary" id="start-game-btn">🚀 เริ่มเกมเลย!</button>
            </div>
        </div>

        <div id="game-screen">
            <h2 id="turn-indicator">ตาของ...</h2>
            <div id="player-list"></div>
            
            <div id="card-area">
                <div id="card-display">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <span id="card-icon" class="card-icon">✨</span>
                        <div id="card-title">ชื่อการ์ด</div>
                        <p id="card-description">คำอธิบาย</p>
                    </div>
                </div>
            </div>

            <div id="player-inventory"></div>

            <div id="game-buttons" style="min-height: 70px;">
                <button id="draw-card-btn" class="game-button btn-primary" style="width: 100%;">🎴 จั่วการ์ด</button>
                
                <div id="action-buttons" style="display:none;">
                    <button id="keep-card-btn" class="game-button btn-secondary" style="display:none;">📥 เก็บไว้ใช้</button>
                    <button id="next-turn-btn" class="game-button btn-success">✅ ตาถัดไป</button>
                </div>
                
                <div id="choice-buttons"></div>
            </div>
        </div>
    </div>

    <script>
    // --- CONFETTI EFFECT (Minimal Version) ---
    const confettiCanvas = document.getElementById('confetti-canvas');
    const ctx = confettiCanvas.getContext('2d');
    let particles = [];
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;

    function fireConfetti() {
        for(let i=0; i<100; i++) {
            particles.push({
                x: window.innerWidth / 2,
                y: window.innerHeight / 2,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                life: 100,
                color: `hsl(${Math.random()*360}, 100%, 70%)`
            });
        }
        requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });
        if(particles.length > 0) requestAnimationFrame(updateConfetti);
    }

    // --- GAME DATA (Fixed Syntax Errors) ---
    const allCards = [
        // Action
        { name: "ทายเครื่องใช้ไฟฟ้า", description: "ผลัดกันพูดชื่อเครื่องใช้ไฟฟ้าในร้านมูฟ ห้ามซ้ำ/ห้ามช้าเกิน 5 วิ", type: "action", icon: "🔌" },
        { name: "คำต้องห้าม", description: "ทุกคนคิดคำ 1 คำเเล้วโน็ตใส่มือถือตัวเอง เเล้วสลับมือถือกับคนฝั่งขวา ถ้ามีคำซ้ำกันเจ้าของมือถือโดน เเละใครเผลอพูดคำบนหัวตัวเอง แพ้!", type: "action", icon: "🚫" },
        { name: "คำต้องเชื่อม", description: "ต่อคำที่เกี่ยวข้องกัน โดยต้องเป็นคำนาม ใครตัน ใครมั่ว โดน! (ใครเห็นต่างสามารถชาเลนจ์ได้เเล้วลงคะเเนน)", type: "action", icon: "🔗" },
	{ name: "ใบคำภาษาอังกฤษ", description: "โดยโอ่จับคู่แบ่งทีม เเล้วให้เเต่ละทีมเขียนคำ 1 คำใน ทรศ เเล้วสลับ ทรศ กันระห่าง 2 ทีม โดยห้ามดูคำนั้น จากนั้นให้ผลัดกันทีละทีม ใบ้คำเป็นภาษาอังกฤษ ทีละทีม ภายใน 1 นาที ถ้าพูดไทยปรับเเพ้", type: "action", icon: "🔗" },
        { name: "สามัคคีคือพลัง", description: "เพื่อมิตรภาพ! ทุกคนในวง ดื่มคนละ 1 กรึ๊บ!", type: "action", icon: "🍻" },
	{ name: "ต่อคำ 2 พยางค์", description: "ผลัดกันต่อคำ 2 พยางค์ไปเรื่อย ๆ คำของใครไม่มีความหมาย หรือ ต่อไม่ได้ โดน (เช่น ชาเย็น เย็นจัง จังฮู้ว . . . )", type: "action", icon: "🍻" },
        { name: "เมนูร้านมูฟ", description: "พูดชื่อเมนูที่มีอยู่จริงในป้ายเมนู ห้ามใช้เมนูแต่ง!", type: "action", icon: "☕" },
        { name: "ฉันคือตัวอะไร?", description: "เขียนชื่อสัตว์ใส่ ทรศ ตัวเองเเล้วสลับกับคนข้างขวา ให้เจ้าของทาย (ถามได้แค่ ใช่/ไม่ใช่) ใครตอบไม่ได้ โดน! ถ้าคำซ้ำกันเจ้าของโทรศัพท์โดน", type: "action", icon: "🐶" },
        { name: "ใบ้คำท่าทาง", description: "แบ่งทีม! โดยโอ่จับคู่ เเล้วเป่ายิ่งฉุปกัน ทีมชนะได้คิดคำใบ้ ส่วนทีมเเพ้ให้ 1 คนเป็นคนตอบ เเล้วที่เหลือต้องรอฟังคำโจทย์จากทีมชนะ เเล้วใบ้ให้ทีมตัวเอง ภายใน 2 นาที ถ้าทันเป็นฝ่ายชนะ ถ้าไม่ทันเป็นฝ่ายแพ้ ", type: "action", icon: "💃" },
        
        // Activity / Hot Topic
        { name: "ระเบิดเวลา", description: "ร้องเพลงแล้วส่งของวนไปเรื่อยๆ เพลงหยุดที่ใคร คนนั้นโดน!", type: "activity", icon: "💣" },
        { name: "เพลงสระอี", description: "ร้องเพลงอะไรก็ได้ โดยเปลี่ยนสระทุกตัวเป็น 'สระอี' ให้เพื่อนทาย ใครทายถูกรอด ที่เหลือโดน", type: "activity", icon: "🎵" },
        { name: "แย่งกันนับ", description: "นับเลข 1 ถึงจำนวนผู้เล่น ใครนับซ้อนกัน หรือเป็นคนสุดท้าย โดน! (ต้องยืนขึ้นตอนนับ)", type: "activity", icon: "🔢" },
        
        // Special & Choice
        { 
            name: "ยมบาลชี้ชะตา", 
            description: "คุณคือผู้คุมกฎ! เลือกเอาว่าจะใจดีหรือใจร้าย?", 
            type: "action", 
            special: true,
            action: 'choice',
            icon: "⚖️",
            choices: [
                { text: '😇 ยมบาลใจดี (ทุกคนรอด)', effect: 'รอดตัวไป! ไม่มีใครโดนทำโทษ' },
                { text: '😈 ยมบาลใจร้าย (สั่งการ)', effect: 'เลือกสั่งใครก็ได้ 1 คน ให้ทำอะไรก็ได้ 1 อย่าง!' }
            ]
        },

        // Curses & Changers
        { name: "ใบคนในวงเสี่ยงทาย", description: "โดยใครที่เปิดได้ไพ่ใบนี้ ให้เลียนแบบบุคคลิก 1 คนในวงเเล้วให้เพื่อน ๆ ทายกันว่า ใบ้ว่าเป็นใคร ใครตอบได้รอด ที่เหลือโดน", type: "changer", special: true, icon: "🥤" },
        { name: "วีรบุรุษช็อตสุดท้าย", description: "ผลัดกันเทน้ำใส่แก้วทีละนิด ใครทำล้นเป็นคนแรก หมดแก้ว!", type: "changer", special: true, icon: "💧" },
        { name: "โซจูล่องหน", description: "คนชงสลับแก้วมั่วๆ แล้วให้ทุกคนเลือก ใครซวยได้แก้วเพียว ดื่ม! เเล้วทำท่าว่าไม่ได้กิน เเล้วมาทายกันว่าใครโดนโซจู ถ้าจับได้ คนโดน เบิ้ล", type: "changer", special: true, icon: "🫣" },
	{ name: "เกมจ้องตา", description: "ให้ทุกคนหลับตาทุกคน เเล้วให้คนที่เปิดได้ไพ่ใบนี้ นับ 1-3 เเล้วทุกคนลืมตาไปจ้องใครสักคน ถ้าใครจ้องตากัน = ดื่ม(หรือโดนลงโทษ)", type: "changer", special: true, icon: "🫣" },
        { name: "Truth or Dare", description: "เลือกเพื่อน 1 คน! ให้มันเลือกว่าจะ 'ตอบความจริง' หรือ 'กล้าทำตามสั่ง'", type: "changer", special: true, icon: "💋" },
        
        // Curse Cards (Targeting)
        { name: "คำสาป: ห้ามใช้นิ้วชี้", description: "เป้าหมายห้ามใช้นิ้วชี้ 5 ตา! โดยห้ามชี้ เเละต้องใช้นิ้วอื่นกดเท่านั้น ", type: "curse", duration: 5, icon: "🤐" },
        { name: "คำสาป: ห้ามใช้มือขวา", description: "เป้าหมายห้ามมือขวาเป็นเวลา 5 ตา", type: "curse", duration: 5, icon: "🙇" }
    ];

    // Duplicate deck for longer game
    let deckData = [...allCards, ...allCards];

    // --- GAME STATE ---
    let players = [];
    let deck = [];
    let currentPlayerIndex = 0;
    let playerInventories = {}; 
    let playerCurses = {}; 

    // --- DOM ELEMENTS ---
    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const playerInputs = document.getElementById('player-inputs');
    const cardDisplay = document.getElementById('card-display');
    const cardFront = document.querySelector('.card-front');
    
    // --- INITIALIZATION ---
    function addInput() {
        if(playerInputs.children.length >= 10) return;
        const div = document.createElement('div');
        div.className = 'player-input-group';
        div.innerHTML = `
            <input type="text" placeholder="ชื่อผู้เล่น ${playerInputs.children.length + 1}">
            <button class="remove-btn" onclick="this.parentElement.remove()">✕</button>
        `;
        playerInputs.appendChild(div);
        div.querySelector('input').focus();
    }

    // Add initial 2 inputs
    addInput(); addInput();

    document.getElementById('add-player-btn').onclick = addInput;

    document.getElementById('start-game-btn').onclick = () => {
        const inputs = Array.from(playerInputs.querySelectorAll('input'));
        players = inputs.map(i => i.value.trim()).filter(v => v);
        
        if (players.length < 2) {
            alert('ขออย่างน้อย 2 คนนะเตง! 🥺');
            return;
        }

        setupScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
        fireConfetti(); // Celebrate start
        initGame();
    };

    function initGame() {
        deck = [...deckData];
        shuffle(deck);
        currentPlayerIndex = 0;
        players.forEach((_, i) => {
            playerInventories[i] = null;
            playerCurses[i] = null;
        });
        updateUI();
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // --- MAIN GAME LOOP ---
    document.getElementById('draw-card-btn').onclick = function() {
        if (deck.length === 0) {
            alert('ไพ่หมดกองแล้ว! สับไพ่ใหม่แปป...');
            deck = [...deckData];
            shuffle(deck);
        }

        const card = deck.pop();
        const cardArea = document.getElementById('card-area');
        
        // Animation
        this.style.display = 'none';
        cardArea.style.transform = "scale(0.95)";
        
        setTimeout(() => {
            cardArea.style.transform = "scale(1)";
            cardDisplay.classList.add('flipped');
            renderCardContent(card);
            
            setTimeout(() => processCardLogic(card), 600);
        }, 150);
    };

    function renderCardContent(card) {
        document.getElementById('card-title').innerText = card.name;
        document.getElementById('card-description').innerText = card.description;
        document.getElementById('card-icon').innerText = card.icon || "✨";
        
        cardFront.className = 'card-face card-front'; // reset
        cardFront.classList.add(`type-${card.type}`);
        
        if(card.special) fireConfetti();
    }

    function processCardLogic(card) {
        const actionBtns = document.getElementById('action-buttons');
        const nextBtn = document.getElementById('next-turn-btn');
        const keepBtn = document.getElementById('keep-card-btn');
        const choiceDiv = document.getElementById('choice-buttons');

        actionBtns.style.display = 'block';
        nextBtn.style.display = 'inline-block';
        keepBtn.style.display = 'none';
        choiceDiv.innerHTML = '';

        if (card.type === 'keeper') {
            keepBtn.style.display = 'inline-block';
            keepBtn.onclick = () => {
                if(playerInventories[currentPlayerIndex]) {
                    alert('มีของอยู่แล้วอะ! ใช้ของเก่าก่อนนะ');
                } else {
                    playerInventories[currentPlayerIndex] = card;
                    alert(`เก็บ "${card.name}" เข้ากระเป๋าแล้ว!`);
                    endTurn();
                }
            };
        } else if (card.type === 'curse') {
            nextBtn.style.display = 'none'; // Force selection
            showTargetSelector(card);
        } else if (card.choices) {
            nextBtn.style.display = 'none'; // Force choice
            card.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'game-button btn-secondary';
                btn.innerText = c.text;
                btn.onclick = () => {
                    alert(c.effect);
                    endTurn();
                };
                choiceDiv.appendChild(btn);
            });
        }
    }

    // --- CURSE SYSTEM ---
    function showTargetSelector(card) {
        const modal = document.getElementById('target-modal');
        const list = document.getElementById('target-players');
        list.innerHTML = '';
        
        players.forEach((p, idx) => {
            if(idx !== currentPlayerIndex) {
                const btn = document.createElement('button');
                btn.className = 'game-button btn-primary';
                btn.innerText = p;
                btn.onclick = () => {
                    playerCurses[idx] = { name: card.name, turns: card.duration };
                    modal.style.display = 'none';
                    alert(`${p} โดนสาป "${card.name}" เป็นเวลา ${card.duration} ตา!`);
                    endTurn();
                };
                list.appendChild(btn);
            }
        });
        modal.style.display = 'flex';
    }

    // --- TURN MANAGEMENT ---
    document.getElementById('next-turn-btn').onclick = endTurn;

    function endTurn() {
        // Reset Card UI
        document.getElementById('card-display').classList.remove('flipped');
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('choice-buttons').innerHTML = '';
        document.getElementById('draw-card-btn').style.display = 'inline-block';

        // Manage Curse Duration (Previous Player)
        if (playerCurses[currentPlayerIndex]) {
            playerCurses[currentPlayerIndex].turns--;
            if (playerCurses[currentPlayerIndex].turns <= 0) {
                playerCurses[currentPlayerIndex] = null; // Curse expired
            }
        }

        // Next Player
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        updateUI();

        // Alert if new player is cursed
        const curse = playerCurses[currentPlayerIndex];
        if (curse) {
            setTimeout(() => {
                alert(`⚠️ แจ้งเตือน: คุณติดคำสาป "${curse.name}" (เหลือ ${curse.turns} ตา)`);
            }, 500);
        }
    }

    // --- UI UPDATER ---
    function updateUI() {
        // Update Turn Text
        document.getElementById('turn-indicator').innerHTML = `ตาของ <span style="color:var(--primary); font-size:1.2em;">${players[currentPlayerIndex]}</span>`;

        // Update Player List
        const list = document.getElementById('player-list');
        list.innerHTML = '';
        players.forEach((p, idx) => {
            const tag = document.createElement('div');
            tag.className = `player-tag ${idx === currentPlayerIndex ? 'active' : ''}`;
            let html = p;
            if (playerCurses[idx]) html += ` <span class="curse-badge">💀</span>`;
            tag.innerHTML = html;
            list.appendChild(tag);
        });

        // Update Inventory
        const invDiv = document.getElementById('player-inventory');
        invDiv.innerHTML = '';
        const item = playerInventories[currentPlayerIndex];
        if (item) {
            const el = document.createElement('div');
            el.className = 'inv-item';
            el.innerHTML = `🎒 ใช้การ์ด: ${item.name}`;
            el.onclick = () => {
                if(confirm(`ยืนยันจะใช้ "${item.name}" ตอนนี้เลยไหม?`)) {
                    alert(`ใช้งาน: ${item.description}`);
                    playerInventories[currentPlayerIndex] = null;
                    updateUI();
                }
            };
            invDiv.appendChild(el);
        }
    }
    </script>
</body>
</html>
